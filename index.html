<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Feedback & Discussion</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwv7mApBghGRZ-6wx1nUsfGLflT7E3VMWLUMQRRKjw1pptpE5Za46xAw_9VnNS3dZBaaA/exec";

    function App() {
      const [studentId, setStudentId] = React.useState('');
      const [comment, setComment] = React.useState('');
      const [feed, setFeed] = React.useState([]);
      const [isLoading, setIsLoading] = React.useState(true);
      const [isSubmitting, setIsSubmitting] = React.useState(false);
      const [statusMessage, setStatusMessage] = React.useState('');
      const [searchQuery, setSearchQuery] = React.useState('');

      const fetchApprovedComments = async () => {
        setIsLoading(true);
        try {
          const response = await fetch(GOOGLE_SCRIPT_URL);
          const data = await response.json();
          if (Array.isArray(data)) {
            setFeed(data.reverse());
          }
        } catch (error) {
          console.error("Failed to load comments:", error);
        } finally {
          setIsLoading(false);
        }
      };

      React.useEffect(() => {
        fetchApprovedComments();
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!studentId.trim() || !comment.trim()) return;

        setIsSubmitting(true);
        setStatusMessage('Submitting your feedback...');

        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
              studentId: studentId.trim(),
              comment: comment.trim()
            })
          });

          setStatusMessage('Feedback submitted! It will appear on this page once approved in your Google Sheet.');
          setStudentId('');
          setComment('');
        } catch (error) {
          setStatusMessage('Error submitting feedback. Please try again.');
        } finally {
          setIsSubmitting(false);
          setTimeout(() => setStatusMessage(''), 5000);
        }
      };

      const filteredFeed = feed.filter(item => 
        (item.comment && item.comment.toLowerCase().includes(searchQuery.toLowerCase())) ||
        (item.studentId && item.studentId.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      return (
        <div className="max-w-3xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="text-center mb-8">
            <h1 className="text-3xl font-bold text-slate-900 mb-2">Class Feedback & Discussion Board</h1>
            <p className="text-slate-600">Submit your opinions or questions. Approved posts appear live below.</p>
          </header>

          {/* TOP: Live Discussion Panel */}
          <section className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm mb-8">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
              <div>
                <h2 className="text-xl font-bold text-slate-800">Approved Discussions</h2>
                <p className="text-xs text-slate-500">Total approved posts: {feed.length}</p>
              </div>
              
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <input
                  type="text"
                  placeholder="Search posts..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="px-3 py-1.5 border border-slate-300 rounded-lg text-sm w-full sm:w-48 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <button
                  onClick={fetchApprovedComments}
                  className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-medium transition"
                >
                  Refresh
                </button>
              </div>
            </div>

            {isLoading ? (
              <div className="text-center py-8 text-slate-500">Loading discussions...</div>
            ) : filteredFeed.length === 0 ? (
              <div className="text-center py-8 text-slate-500 italic">
                {searchQuery ? "No posts match your search query." : "No approved posts yet. Check back soon!"}
              </div>
            ) : (
              <div className="space-y-4">
                {filteredFeed.map((item, idx) => (
                  <div key={idx} className="border-l-4 border-blue-500 bg-slate-50 p-4 rounded-r-lg border-y border-r border-slate-200">
                    <div className="flex justify-between items-center text-xs text-slate-500 mb-2">
                      <span className="font-semibold text-slate-700 bg-blue-100 text-blue-800 px-2 py-0.5 rounded">
                        ID: {item.studentId}
                      </span>
                      <span>{item.timestamp ? new Date(item.timestamp).toLocaleDateString() : ''}</span>
                    </div>
                    <p className="text-slate-800 text-sm whitespace-pre-wrap leading-relaxed">{item.comment}</p>
                  </div>
                ))}
              </div>
            )}
          </section>

          {/* BOTTOM: Submission Form */}
          <section className="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
            <h2 className="text-xl font-bold text-slate-800 mb-4">Submit Your Feedback or Question</h2>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-slate-700 mb-1">Student ID / Nickname</label>
                <input
                  type="text"
                  placeholder="e.g. S123456"
                  value={studentId}
                  onChange={(e) => setStudentId(e.target.value)}
                  required
                  className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
              </div>

              <div>
                <div className="flex justify-between items-center mb-1">
                  <label className="block text-sm font-medium text-slate-700">Opinion / Feedback / Question</label>
                  <span className="text-xs text-slate-400">{comment.length}/500</span>
                </div>
                <textarea
                  placeholder="Type your feedback, opinion, or question here..."
                  value={comment}
                  onChange={(e) => setComment(e.target.value.slice(0, 500))}
                  required
                  rows={4}
                  className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"
                />
              </div>

              <button
                type="submit"
                disabled={isSubmitting}
                className={`w-full py-3 px-4 rounded-lg font-medium text-white transition ${
                  isSubmitting ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'
                }`}
              >
                {isSubmitting ? 'Submitting...' : 'Submit Post'}
              </button>

              {statusMessage && (
                <div className="p-3 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-lg text-sm text-center font-medium">
                  {statusMessage}
                </div>
              )}
            </form>
          </section>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
